# EnergyPod — the permanent deployment (docs/DEPLOY_DOCKER.md).
#
# Two services on the operator's always-on Docker host:
#   energypod — the controller (Modbus to the three gateways, sqlite at
#               /app/var/live-write.sqlite3, guarded API on 8080 internal).
#   console   — nginx serving the built console and proxying /api/v1 (with
#               the WebSocket) and /healthz to the controller.
#
# The operator's browser keeps the familiar port: the console publishes on
# host port 8080.  The controller's own API is published on 127.0.0.1:8081
# (host-local only — scripts and verification, not the LAN).
#
# restart: unless-stopped is the point of this deployment: the controller
# survives crashes and host reboots without this Windows session.
#
# SECRETS: nothing is baked into either image.  var/ (the env files, the
# bearer-token store, and the sqlite database) is a bind mount; config/ is
# mounted read-only.  docs/DEPLOY_DOCKER.md owns the transfer + chown steps.
#
# Usage (from the repo root, on the Docker host):
#   docker compose up -d --build
#   docker compose logs -f energypod
#   ./scripts/docker-verify.sh

services:
  energypod:
    build:
      context: .
      target: runtime
    container_name: energypod-controller
    restart: unless-stopped
    volumes:
      # var/ = the durable store AND the secrets: live-write.sqlite3 (the
      # historian, leases, pvoutput/calibration state), live-credentials.json
      # (the bearer-token store), solcast.env + pvoutput.env (sourced by the
      # entrypoint).  One mount, one chown (see the runbook).
      - ./var:/app/var
      # The commissioned configuration, read-only: the deployment's units,
      # windows, policies, and every program block.
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - TZ=Australia/Brisbane

  console:
    build:
      context: .
      target: console-nginx
    container_name: energypod-console
    restart: unless-stopped
    depends_on:
      - energypod
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    environment:
      - TZ=Australia/Brisbane
