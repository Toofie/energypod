# EnergyPod — the ALL-IN-ONE deployment (docs/DEPLOY_DOCKER.md).
#
# The operator's model: ONE image carrying everything — controller, console,
# commissioned config, credentials, and the database snapshot.  No volumes,
# no mounts, no separate file transfers: build once on the operator's
# machine (where var/ and config/ live), deploy the image to the always-on
# host, and `docker compose up -d`.
#
#   energypod — the controller (Modbus to the three gateways, the embedded
#               sqlite store, the guarded API on 8080 internal).
#   console   — nginx serving the built console and proxying /api/v1 (with
#               the WebSocket) and /healthz to the controller.
#
# The operator's browser keeps the familiar port: the console publishes on
# host port 8080.  The controller's own API publishes on 127.0.0.1:8081
# (host-local only — scripts and verification, not the LAN).
#
# restart: unless-stopped + the operator's nightly restart: the fleet
# re-arms at every boot (site.boot_armed: true in the embedded config), so
# no nightly re-arm is needed.
#
# THE IMAGE CARRIES SECRETS (the operator accepted this for a local-only
# deployment): never push it to a registry.  A REBUILD re-snapshots the
# database to build day — see docs/DEPLOY_DOCKER.md §6.
#
# Usage (from the repo root, on the build machine):
#   docker compose build            # bakes var/ + config/ at build time
#   docker save energypod-controller energypod-console | gzip > deploy.tar.gz
#   # transfer the images (or build on the host with the same repo + var/)
#   docker compose up -d
#   ./scripts/docker-verify.sh

services:
  energypod:
    build:
      context: .
      target: runtime
    # The explicit image names make save/load honest: `docker compose build`
    # tags exactly these, `docker save` (docs §3) saves exactly these, and
    # after `docker load` on the host, `docker compose up -d` uses the loaded
    # images instead of rebuilding (which would re-snapshot the database).
    image: energypod-controller:latest
    container_name: energypod-controller
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - TZ=Australia/Brisbane

  console:
    build:
      context: .
      target: console-nginx
    image: energypod-console:latest
    container_name: energypod-console
    restart: unless-stopped
    depends_on:
      - energypod
    ports:
      - "8080:80"
    environment:
      - TZ=Australia/Brisbane
