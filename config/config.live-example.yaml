# EnergyPod controller — LIVE fleet example, pinned to the authorized
# 2026-08-22 captures (docs/evidence/live-capture-2026-08-22.json and
# live-capture-followup-2026-08-22.json, decoded per
# docs/evidence/field-mapping-2026-08-22.md).
#
# This file is an EXAMPLE, not a deployment artifact: copy it, re-verify every
# per-unit fact against your own commissioning captures, and never point a
# controller at hardware before then.
#
# Safety posture of this file:
#   - mode observe_only, and structurally so: the run-mode composition wires
#     no interactive qualification path, so however many coherent telemetry
#     cycles the gateways serve, no unit can cross into DISARMED, the facade
#     refuses arm, and the only register write the controller can ever issue
#     is the bounded stop triple [1, 0, 0] at 0x0200.  Actuation stays gated
#     on the open commissioning items (power-direction sign on the real
#     installation, watchdog renewal timing, string-identity binding —
#     field-mapping section 7 / PROTOCOL_EVIDENCE section 4a).
#   - Per-unit facts below are the live ones the captures pinned: gateway
#     endpoints, device id 4, the wire identity decoded from the 0x8106 RTU-ID
#     pair (low word first, rendered byd-{rtu_id:08x}), and the commissioned
#     cell topology (MID 6 BIC / 60 cells, RHS 5 BIC / 50 cells, LHS 6 BIC /
#     60 cells).  A wrong expected_identity here latches the unit INHIBITED
#     (identity mismatch); the observation always reports the identity the
#     hardware served, never this configuration.
#   - NO SECRET IS STORED HERE.  `authentication.operator_credential_ref` is a
#     secret *reference* naming the operator credential store; the deployment
#     resolves it to a credential file (the FileCredentialStore JSON mapping
#     of bearer tokens to principals) mounted read-only, and the controller is
#     handed that store at startup.  The credential file itself — tokens,
#     subjects, scopes — lives outside this configuration and outside the
#     repository.  Do not inline tokens, keys, or passwords anywhere in this
#     file.
#   - The timing block is the cross-validated commissioning budget: the
#     complete operation budget (1.00 s) and the renewal cadence budget
#     (1.00 s) both fit inside the 2.35 s device command expiry, and the
#     write timeout fits strictly inside the control period.
#   - The database path stays on the /var/lib/energypod data volume so
#     `energypod db backup`/`restore` see one durable store.
schema_version: 1
revision: 2
mode: observe_only

site:
  site_id: home
  timezone: Australia/Brisbane
  expected_unit_count: 3

units:
  - unit_id: mid
    display_name: Middle Pod
    endpoint: { host: 192.168.1.11, port: 4196 }
    transport_profile: waveshare_rtu_over_tcp
    protocol_profile: iot
    device_id: 4
    expected_identity: byd-2c225097
    expected_cell_count: 60
  - unit_id: rhs
    display_name: Right Pod
    endpoint: { host: 192.168.1.12, port: 4196 }
    transport_profile: waveshare_rtu_over_tcp
    protocol_profile: iot
    device_id: 4
    expected_identity: byd-2c225076
    expected_cell_count: 50
  - unit_id: lhs
    display_name: Left Pod
    endpoint: { host: 192.168.1.13, port: 4196 }
    transport_profile: waveshare_rtu_over_tcp
    protocol_profile: iot
    device_id: 4
    expected_identity: byd-2c225095
    expected_cell_count: 60

timing:
  # Timing mirrors the prior PROVEN integration (modbus/byd/config.py):
  # timeout 3.0 s per request, 0.1 s inter-frame gap, ~1.5 s update cadence.
  # The full-plan telemetry poll (17 windows x (gap + response)) must fit the
  # control period, so observe-only polls run at the slower cadence the
  # gateway demonstrably sustains.
  device_command_expiry_s: 9.00
  device_command_expiry_evidence: commissioning://watchdog-trial-2026-08/rev-2
  control_period_s: 5.00
  essential_read_timeout_s: 3.00
  kernel_timeout_s: 0.50
  audit_timeout_s: 0.50
  write_timeout_s: 1.00
  acknowledgement_timeout_s: 1.00
  maximum_jitter_s: 0.50
  renewal_margin_s: 0.50
  inter_request_delay_s: 0.10

authentication:
  enabled: true
  operator_credential_ref: secret://var/live-credentials.json
  trusted_proxy_cidrs:
    - 192.168.1.0/24

storage:
  database_path: var/controller.sqlite3
  busy_timeout_ms: 250
