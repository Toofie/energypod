# EnergyPod controller — LIVE WRITE-ENABLED example, commissioned against the
# authorized 2026-08-22 evidence: the captures (docs/evidence/
# live-capture-2026-08-22.json and live-capture-followup-2026-08-22.json,
# decoded per docs/evidence/field-mapping-2026-08-22.md) and the direction
# trial that measured the wire behavior write-enabled control stands on
# (negative P = CHARGE, positive P = DISCHARGE at the 0x0200 [1, P, Q]
# objective; unrenewed objective expiry ~3.5-4.0 s).
#
# This file is an EXAMPLE, not a deployment artifact: copy it, re-verify every
# per-unit fact against your own commissioning captures, and never point a
# controller at hardware before then.
#
# Safety posture of this file:
#   - mode write_enabled composes ONLY because every gate holds
#     (API_CONTRACTS "Write-enabled run mode"): a control policy, enabled
#     authentication, `device_command_expiry_evidence` that references the
#     measured live watchdog trial (the live-trial:// spelling below — the
#     observe-only placeholder spellings are refused in this mode), and a
#     renewal cadence inside the corroborated envelope (vendor 1 s and
#     prior-integration 1.5 s cadences; the 1.0 s control period here) whose
#     cadence budget fits strictly inside the commissioned 3.0 s expiry,
#     itself inside the measured ~3.5-4.0 s watchdog window with margin.
#   - Single-writer authority is structural, not assumed: at arm time the
#     actor reads the served PQ objective readback (IoT 0x1060+17/+18) and a
#     nonzero objective it did not itself write latches INHIBITED with cause
#     `external_writer` until a privileged acknowledgement clears it.
#   - The only writable registers remain [1, signed P, signed Q] at 0x0200;
#     no other address is writable by any composition, mode, or tool.
#     Emergency stop, fence, and shutdown dominate renewal and issue the
#     bounded zero [1, 0, 0].
#   - Per-unit facts below are the live ones the captures pinned: gateway
#     endpoints, device id 4, the wire identity decoded from the 0x8106 RTU-ID
#     pair (low word first, rendered byd-{rtu_id:08x}), and the commissioned
#     cell topology (MID 6 BIC / 60 cells, RHS 5 BIC / 50 cells, LHS 6 BIC /
#     60 cells).  A wrong expected_identity latches the unit INHIBITED
#     (identity mismatch); the observation always reports the identity the
#     hardware served, never this configuration.
#   - NO SECRET IS STORED HERE.  `authentication.operator_credential_ref` is a
#     secret *reference* naming the operator credential store; the deployment
#     resolves it to a credential file (the FileCredentialStore JSON mapping
#     of bearer tokens to principals) mounted read-only, and the controller is
#     handed that store at startup.  The credential file itself — tokens,
#     subjects, scopes — lives outside this configuration and outside the
#     repository.  Do not inline tokens, keys, or passwords anywhere in this
#     file.
#   - The timing block is the commissioned write budget: the complete
#     operation budget (2.40 s) and the renewal cadence budget (1.60 s) both
#     fit strictly inside the 3.00 s device command expiry, and the 0.50 s
#     write timeout fits strictly inside the 1.00 s control period.  The
#     pod-parking mode write carries its OWN line (`mode_write_timeout_s`)
#     outside both budgets: it is a one-shot operator act, never
#     cadence-bound.
#   - Read-plan budget against that cadence (SYNC_RESILIENCE_AUDIT B4/B5):
#     steady polls read 7 core windows + the probe; the every-3rd-cycle cell
#     window makes 8; a cell-deny re-verification promotes cells onto any
#     cycle (9 windows ~1.0 s at the 0.1 s inter-frame gap), and the cold
#     ring adds one window every 8th cycle — every shape fits inside the
#     1.50 s control period and the 1.60 s renewal budget below.
#   - The database path stays on the /var/lib/energypod data volume so
#     `energypod db backup`/`restore` see one durable store, and is distinct
#     from the observe-only deployment's database.
schema_version: 1
revision: 8
mode: write_enabled

site:
  site_id: home
  timezone: Australia/Brisbane
  expected_unit_count: 3

units:
  - unit_id: mid
    display_name: Middle Pod
    endpoint: { host: 192.168.1.11, port: 4196 }
    transport_profile: waveshare_rtu_over_tcp
    protocol_profile: iot
    device_id: 4
    expected_identity: byd-2c225097
    expected_cell_count: 60
  - unit_id: rhs
    display_name: Right Pod
    endpoint: { host: 192.168.1.12, port: 4196 }
    transport_profile: waveshare_rtu_over_tcp
    protocol_profile: iot
    device_id: 4
    expected_identity: byd-2c225076
    expected_cell_count: 50
  - unit_id: lhs
    display_name: Left Pod
    endpoint: { host: 192.168.1.13, port: 4196 }
    transport_profile: waveshare_rtu_over_tcp
    protocol_profile: iot
    device_id: 4
    expected_identity: byd-2c225095
    expected_cell_count: 60

timing:
  # The 2026-08-22 direction trial measured the unrenewed objective expiry at
  # ~3.5-4.0 s; the commissioned 3.00 s expiry sits inside that window with
  # margin, the 1.00 s renewal cadence sits inside the corroborated 1 s /
  # 1.5 s envelope, and every budget below fits strictly inside the expiry.
  device_command_expiry_s: 3.00
  device_command_expiry_evidence: live-trial://direction-2026-08-22/rev-1
  control_period_s: 1.50
  essential_read_timeout_s: 1.00
  kernel_timeout_s: 0.10
  audit_timeout_s: 0.10
  write_timeout_s: 0.50
  acknowledgement_timeout_s: 0.10
  maximum_jitter_s: 0.10
  renewal_margin_s: 0.50
  inter_request_delay_s: 0.10
  # The pod-parking mode write's OWN budget — its own line in the write
  # budget because it is a ONE-SHOT operator act, not cadence-bound (the
  # 2026-08-24 live smoke: this gateway's FC16-to-0x8000 turnaround outran
  # the 0.50 s write timeout commissioned for the PQ-objective cadence,
  # while a direct script at 1.0 s succeeded — docs/evidence/
  # standby-cycle-2026-08-24.md).  It rides neither the complete operation
  # budget above nor the renewal cadence: the named parking operation's
  # total is its prior read + this write + its readback, each leg within
  # its own budget.  Must exceed write_timeout_s and
  # inter_request_delay_s; 5.0 is the sane ceiling.
  mode_write_timeout_s: 2.00

policy:
  version: 5
  threshold_provenance: live-commissioning-2026-08-22
  max_fleet_charge_w: 6000
  max_fleet_discharge_w: 6000
  max_unit_charge_w: 2500
  max_unit_discharge_w: 2500
  minimum_soc_pct: 10.0
  maximum_soc_pct: 95.0
  # ABSOLUTE per-cell voltage bounds — these remain HARD GATES and are the
  # actual over/under-charge protection; they are never relaxed by the
  # imbalance tier below.  The imbalance bound is an EARLY-WARNING tier only:
  # operator-relaxed 2026-08-23 from 0.050 to 0.500 (10x) after the live
  # fleet discharge block (LHS measured a genuine but marginal 54 mV spread
  # at 99% SOC against the old 50 mV bound, vetoing the whole fleet intent).
  # Crossing it no longer blocks dispatch; the console surfaces any spread
  # above the old 0.050 V early-warning line as a per-unit warning.
  minimum_cell_v: 2.80
  maximum_cell_v: 3.65
  maximum_cell_imbalance_v: 0.500
  minimum_temperature_c: 0.0
  maximum_temperature_c: 45.0
  maximum_soc_difference_pct: 5.0
  maximum_soc_jump_pct: 10.0
  maximum_telemetry_age_s: 3.0
  maximum_cell_data_age_s: 15.0
  # One authorization must outlive one control period and die inside the
  # device expiry: 1.50 s against the 1.00 s cadence and 3.00 s expiry.
  authorization_lifetime_s: 2.00
  ramp_limit_w_per_s: 1000
  stable_samples_to_rearm: 3
  reactive_power_limit_var: 0
  # ---------------------------------------------------------------------------
  # BLOCKING FAULT/WARNING CODES — READ BEFORE EDITING (S1, 2026-08-24).
  #
  # The decoder generates codes in the format {prefix}_{bit} over the fault
  # catalog's word prefixes (adapters/modbus/faults.py; PROTOCOL_EVIDENCE 9):
  #   warning words: PCS_Warning0..3, DCDC_Warning0..3, Stack_Warning0,
  #                  Becu0_Warning0..1
  #   fault words:   PCS_Fault0..5, DCDC_Fault0..5, Stack_Fault0..1,
  #                  Becu0_Fault0..3
  # e.g. PCS_Fault0_1, Stack_Warning0_12, and the two EE-calibration signals
  # below.  ANY other spelling (human names such as
  # PCS_EE_CALIBRATION_OUT_OF_RANGE) can NEVER match a decoded code — the
  # earlier revision of this file carried exactly such names and the intended
  # block was silently inert (fail-open).
  #
  # The EE-calibration signals the operator intended to block are WARNING
  # bits, not fault words:
  #   PCS_Warning0_1  = "EE Calibration Parameter Out of Range"
  #   DCDC_Warning0_1 = "EEPROM Calibration Parameter Out of Range"
  # (PROTOCOL_EVIDENCE 9, confirmed by vendor code; both appear throughout
  # the vendor's own logs.)
  #
  # THEY ARE DELIBERATELY NOT ENABLED HERE: both bits are STANDING-ACTIVE on
  # all three pods of this fleet (live-capture-2026-08-22: PCS_Warning0 = 2
  # and DCDC_Warning0 = 2 on mid, rhs and lhs alike), and the vendor evidence
  # explicitly does not establish root cause, severity, or a safe reset for
  # them.  Wiring them into blocking_warning_codes would therefore deny EVERY
  # dispatch on this fleet — the mirror-image failure of the inert block.
  # Enabling them is a commissioning decision: uncomment the two lines below
  # only after the operator has ruled these warnings blocking-worthy.
  # ---------------------------------------------------------------------------
  blocking_fault_codes: []
  # blocking_warning_codes:
  #   - PCS_Warning0_1
  #   - DCDC_Warning0_1
  blocking_warning_codes: []
  # ARM-TIME SOLE-WRITER PREFLIGHT — pod-autonomy discrimination band
  # (2026-08-24 live blocker).  The pods' OWN firmware autonomously self-
  # charges by holding a PQ objective on the write register: measured
  # ~-520..-560 W daytime CT-following and up to ~-2.27 kW deep self-charge
  # (negative P = CHARGE, the live-proven sign convention).  A fresh
  # controller process has no write provenance, so without this band the
  # preflight classified the battery's own self-consumption as a FOREIGN
  # writer and latched external_writer after every restart — an unwinnable
  # race (the device watchdog reverts a bounded zero in ~1.34 s vs ~5-6 s
  # re-qualification; ~40 arm attempts failed over 25 min on 2026-08-24
  # while mid self-charged at -2.2 kW throughout).  With the band set, a
  # nonzero readback objective this process did not write — negative P
  # within the band, Q zero — is classified POD AUTONOMY: the arm proceeds
  # and our renewed objective replaces the pod's own (beat-autonomy).  2500
  # covers the observed autonomous range while staying inside
  # max_unit_charge_w; anything else (positive/discharge objectives,
  # magnitudes beyond the band, any reactive component) still latches
  # external_writer exactly as before.  An operator may still take over a
  # beyond-band objective deliberately: POST /api/v1/arm with
  # {"confirmation":"ARM","takeover":"ACKNOWLEDGE"} (audited, never
  # persisted).
  autonomous_charge_signature_max_w: 2500
  # ---------------------------------------------------------------------------
  # SELF-HEALING AWARENESS LAYER (2026-08-24 recovery research R4, promoted
  # P1 vi/iii) — DETECTION ONLY.  No control path consumes these keys; the
  # batteries' own self-recovery (watchdog reversion, autonomy resumption,
  # cell balancing, SOC re-estimation, stable-sample requalification) is
  # trusted by design, and what the controller owes the operator is honest
  # detection of self-healing in progress, of ambiguous behavior, and of the
  # firmware-wedge class that historically required a physical power cycle.
  # ---------------------------------------------------------------------------
  # Actuation-coherence watchdog: this many CONSECUTIVE cycles of authorized
  # watts with the measured battery power never moving alarm once
  # (actuation_incoherent audit + actuation.incoherent event + the
  # unit's health_state / control-readiness reason).  At the 1.50 s control
  # period, 4 cycles = ~6 s — the 22:11Z silent actuation loss and the
  # publish-fence wedge took 6+ MINUTES of operator staring to notice.
  # Re-arms only after a coherent cycle or the authorization ending.
  actuation_coherence_cycles: 4
  # The absolute movement floor: a cycle whose measured movement is BELOW
  # min(50% of the authorized figure, this floor) is "confidently still"
  # (wedge signature), one at or ABOVE max(...) is "confidently actuating",
  # and the dead zone between refuses to conclude — which is exactly what
  # keeps tiny setpoints out of court (a healthy 100 W command moves less
  # than 150 W and so can never accumulate a streak, while a fully silent
  # pod still alarms).
  actuation_coherence_min_movement_w: 150
  # SELF-CHARGE FLOAT DEADBAND (DESIGN_BATTERY_HEALTH_WATCH §3.1, Wave 0
  # W0-1): |measured battery watts| below this renders NEITHER
  # self-charging NOR flap.  At 96-99% SOC the pods float ACROSS zero
  # (observed rhs straddle -16/0/+33 W) and the old exact-zero test flapped
  # the health state 158 transitions in one night; floating at the top is
  # the steady state of a full pack.  25 sits above the metering noise
  # floor (tens of watts) and an order below the genuine CT-following
  # self-charge class (-520..-560 W); beyond the deadband an in-band float
  # (e.g. +99 W) still renders self_healing, so float visibility survives.
  # Ceiling 100: beyond it the deadband would begin to eat the legitimate
  # float class.
  self_charge_deadband_w: 25.0
  # COHERENCE BASELINE GAP GRACE (§3.2, Wave 0 W0-2a): an authorization gap
  # (intent renewal lapse, telemetry_stale dip) shorter than this, with
  # delivery continuing, is the SAME coherence episode — the pre-command
  # baseline survives and is never re-anchored onto the watts the pod was
  # already delivering.  That re-anchoring is exactly the mechanism behind
  # both live 2026-08-24 actuation_incoherent false positives (steady
  # 87-96%-of-command delivery read as "no movement").  12 s is the
  # night-writer handback-grace precedent, covering the observed ~4-8 s
  # watchdog hand-back with margin; beyond the grace, or once measured
  # power returns to the idle band, the baseline re-anchors as before.
  coherence_gap_grace_s: 12.0
  # The commissioned EXPECTED autonomous battery-power envelope: negative
  # self-charge (measured ~-520..-560 W daytime CT-following, up to ~-2.27 kW
  # deep self-charge) to POSITIVE evening CT-following discharge.  Measured
  # power OUTSIDE this band while no intent claims the unit is timestamped
  # evidence (unexpected_autonomy audit, at most one per unit per 60 s,
  # carrying the measured watts + SOC + mode words) — turning mid's standing
  # unexplained ±1.2 kW oscillation into diagnosable evidence.  NEVER a
  # block, never an alarm-tier state: health stays healthy/self_healing.
  #
  # POSITIVE EDGE RECALIBRATED +300 -> +1000 (2026-08-23 evening, config
  # rev 5): the +300 edge was commissioned from DAYTIME evidence only
  # (+40..+160 W float), before the fleet's evening behavior had ever been
  # observed.  Live evidence 2026-08-23 16:40-19:50 local (recorder
  # deployed, then a continuous 1/min unexpected_autonomy stream on lhs):
  # after two days pinned at 98-99% SOC with the 54 mV top-of-charge
  # imbalance (the B6 class), lhs's own firmware held a STEADY uncommanded
  # discharge — run_mode_w 0 "Matching Load" CT-following, 695-914 W over
  # 20 samples (mean 780, stdev 51; pack V×I corroborates), SOC 99 -> 76%
  # at exactly the matching rate, imbalance closing 54 -> 5 mV — benign
  # firmware autonomy (operator precedent: trust the battery, capture
  # evidence).  mid/rhs floated +16..+279 W (in band); mid's episodic
  # excursions are the oscillation class and remain OUTSIDE the band at
  # their ±1.2 kW peaks, so the recorder still catches them.  +1000 keeps
  # ~10-17% margin above the observed legitimate hold while staying below
  # the 1.2 kW anomaly class, mirroring the -2600 negative edge's
  # commissioning margin over the observed -2.27 kW deep self-charge.
  expected_autonomy_band_w: [-2600, 1000]
  # ---------------------------------------------------------------------------
  # NIGHT-WRITER DETECTOR (2026-08-23 census queue; PRODUCT_NEXT §2 S2) —
  # ZERO-EXTRA-FRAMES evidence machinery, composed ALWAYS (no config block;
  # these defaulted keys are its only knobs, and detection is all they do).
  # The served PQ objective (0x1060+17/+18 — already in the read plan) is
  # sampled while the controller commands nothing, recorded as timestamped
  # evidence, and escalated to foreign_objective_observed ONLY by the pinned
  # rules (API_CONTRACTS "Night-writer detector").  The signature alone
  # cannot distinguish an external night CHARGE from the pod's own
  # self-charge — both are negative, both sit inside the band above — so
  # evidence comes first and the alert tier rides pattern rules on top.
  # ---------------------------------------------------------------------------
  # Minimum spacing between recorded samples (the effective live cadence is
  # this floor AND the cold ring's ~96-108 s serving period of the detail
  # block, whichever is slower — the detector issues no reads of its own).
  foreign_objective_sample_interval_s: 30.0
  # Consecutive qualifying samples both pattern rules require before an
  # in-band objective escalates (remote-PQ-mode corroboration, or sustained
  # charge beyond the class below without PV evidence).  At the live cadence
  # 3 samples ≈ 5 minutes of continuous evidence.
  foreign_objective_sustained_samples: 3
  # The observed self-charge magnitude class: sustained charge objectives at
  # or beyond this magnitude WITH no PV evidence (grid importing) escalate.
  # 1000 W sits above the observed typical ~-520..-700 W CT-following
  # self-charge and below the once-observed -2.27 kW deep class (which
  # occurred by day, WITH export evidence, and so stays quiet).
  foreign_objective_self_charge_class_w: 1000
  # Quiet window after our own claim/authority ends: our lapsed objective's
  # residue (the watchdog clears it in 4-8 s) records as handback_grace
  # evidence and can never classify foreign.  12 s covers the observed
  # hand-back with margin.
  foreign_objective_handback_grace_s: 12.0
  # The site's OWN scheduled night writer, commissioned as the EXPECTED
  # nightly charge: the existing Docker solution charges ALL THREE batteries
  # at 2500 W per unit from 00:00 to 06:00 nightly.  A fleet-SYNCHRONIZED
  # in-band charge inside 0.8x..1.2x of this figure classifies quiet as
  # expected_nightly_charge — evidence with a clear characterization, never
  # the alert tier (an expected writer, not an intruder; a partial-fleet or
  # off-magnitude charge still escalates normally).  Setting this key does
  # NOT sanction the writer: the arm-time sole-writer preflight and its
  # external_writer latch are unchanged (arming mid-charge follows the
  # ADD-1 pod-autonomy doctrine; arming after the 06:00 clear is ordinary).
  foreign_objective_expected_charge_w: 2500
  # How many units must hold the synchronized -2500 W charge for the
  # recognition.  The scheduler charges the batteries it chooses: at the
  # 2026-08-24 00:00 commissioning observation lhs and mid charged together
  # while a full rhs (98% SOC) floated -- a synchronized PAIR is the known
  # writer's minimum footprint, and a lone pod never qualifies.
  foreign_objective_expected_min_units: 2
  debug_modes_enabled: false

authentication:
  enabled: true
  operator_credential_ref: secret://var/live-credentials.json
  trusted_proxy_cidrs:
    - 192.168.1.0/24

storage:
  database_path: var/live-write.sqlite3
  busy_timeout_ms: 250

# Excess-solar accelerated charging (advisory) — DEFAULT OFF, and this
# block stays COMMENTED OUT on this deployment: an ABSENT block composes
# nothing at all (no adviser, no export triple, no register-tier promotion,
# no `adviser_state` in the snapshot, and the activation toggle answers 409
# excess_charging_not_commissioned) — byte-identical behavior.  A PRESENT
# block composes the machinery with `enabled` gating PARTICIPATION
# (DESIGN_EXCESS_ACTIVATION P6): an explicit `enabled: false` composes
# suspended at boot and is enableable at the runtime toggle — which is what
# makes the console's first enable possible without a config edit.
#
# The feature is an ADVISER: it submits ordinary short-TTL `optimizer`
# charge intents under the composed automation principal
# `energypod:excess-adviser` (audit-attributable, never on REST/MCP), the
# deterministic bound is one additional min() term in the allocator
# (min(max_charge_from_export_w, max(0, fleet grid export - margin)),
# collapsing to 0 on any missing/bad/stale per-pod grid word at PCS
# 0x1000+17), and hand-back to each pod's own CT-following autonomy is by
# non-renewal only — the TTL lapse plus the ~3.5-4.0 s firmware watchdog.
# A manual or agent intent always displaces it (arbiter priority).
#
# Commissioning gates (refused at validation time otherwise, and they bind
# to block-PRESENCE — a disabled block that could never be enabled safely
# is refused too, because the runtime toggle can never raise a cap or relax
# a gate): write_enabled mode with a policy; max_charge_from_export_w <=
# policy.max_unit_charge_w; export_telemetry_max_age_s >
# control_period_s + essential_read_timeout_s; exit_hysteresis_w <
# min_acceleration_w; 0 < intent_ttl_s <= 300 and > control_period_s.
#
# FIRST-TRIAL WIRING (DESIGN_EXCESS_ACTIVATION §4): the trial deliberately
# starts at the RUNTIME toggle, not `enabled: true` — the window's start
# and end are the operator's console acts, boot is off, and a mid-trial
# reboot degrades to off (P1's fail-safe direction).  The ONLY key changed
# from the commissioned defaults is the cap: `max_charge_from_export_w:
# 500` for the whole trial; graduation to 2500 is a config edit and
# restart (the commissioned path), never the runtime toggle (P5).  The
# NET-BILLING acknowledgement ("this site's billing nets across phases")
# is NOT a config key: it is captured ONCE, durably, through the first
# enable's `"economics": "NET_BILLED"` field and never re-prompted.
#
# TRIAL COMMISSIONING (resolved 2026-08-24, present-but-off): the block below
# is UNCOMMENTED so the machinery composes — the console tile and toggle are
# visible, the PCS grid block is promoted — while `enabled: false` keeps
# participation suspended; the trial STARTS at the operator's toggle (which
# itself requires the one-time NET_BILLED acknowledgement). The trial-cap
# tension flagged by the implementation is resolved by lowering the autonomy
# assumption for the trial: assumed_autonomous_charge_w 300 puts the
# beat-autonomy ENTRY threshold at 400 W, inside the 500 W cap — the
# simulator-proven combination. Graduation to production restores 2500 W and
# re-commissions the autonomy key from observed daytime self-charge.
#
excess_charging:
  enabled: false            # suspended at boot; the trial STARTS at the toggle
  export_headroom_margin_w: 200
  max_charge_from_export_w: 500   # the trial cap (graduation restores 2500)
  export_telemetry_max_age_s: 3.0
  assumed_autonomous_charge_w: 300  # trial value: entry threshold 400 W < 500 W cap
  min_acceleration_w: 100
  exit_hysteresis_w: 50
  intent_ttl_s: 10.0

# Schedules (DESIGN_SCHEDULES §3) — this block stays COMMENTED OUT on this
# deployment: an ABSENT block composes NOTHING at all (no evaluation loop, no
# `schedule_state` in the snapshot, and GET/PUT /api/v1/schedule answer 409
# schedule_not_commissioned) — byte-identical behavior. A schedule can never
# act on a site that did not commission scheduling.
#
# A PRESENT block composes the whole surface: both REST routes, the
# ScheduleRunner in the fleet cycle (one bounded tick AFTER the polls and
# BEFORE the excess adviser — the schedule's claim is a published fact, the
# adviser the opportunist), and the `schedule_state` snapshot projection.
# There is deliberately NO `enabled` key: the plan IS the state (an empty
# plan is off, an entry's own `enabled` flag is its pause, "pause
# everything" is one publish disabling every entry) — a second master switch
# would be a second way to be silently off.
#
# THE NIGHT-WRITER POSTURES. The site's other applications write these
# batteries AT NIGHT, and the arm-time sole-writer preflight latches
# external_writer by design ("coordinate, don't fight"):
#   - YIELD (the shipped default, below): schedules are a DAY-WINDOW feature.
#     Only the union of `allowed_windows_local` may be commanded; the night
#     stays with the existing writers.
#   - PARTITION (the operator-granted upgrade): the external writers stand
#     down for a granted window — a config revision WIDENING these windows
#     plus a restart, then the first night publish carries
#     "night_posture": "PARTITION_ACKNOWLEDGED" once (the durable
#     once-ever audit fact; never re-prompted).
#   - CONTESTED is NOT implementable and NOT offered: no setting says "run
#     at night anyway and fight them" — the refusal names the two honest
#     paths instead.
# "Night" always means outside 06:00-20:00 local (DAY_DEFAULT), independent
# of how these windows are narrowed or widened, so the acknowledgement and
# the console copy always mean the same thing.
#
# The windows are PUBLISH gates, never evaluator gates: a plan already in
# the store before a config NARROWING still evaluates (the config revision
# is the operator's act; the NEXT publish is the one refused). The console
# can never widen the policy — only a config revision plus a restart can.
#
# Commissioning gates: `intent_ttl_s` must exceed timing.control_period_s
# (the runner renews exactly once per fleet cycle) and stay inside
# (0, 300] seconds — a window may not out-live ordinary intents. Window end
# is NON-RENEWAL: the held intent lapses by TTL and the ~3.5-4.0 s firmware
# watchdog returns each pod to its own autonomy (the same hand-back as every
# other intent source, and the fail-safe if the runner dies mid-window).
# A schedule intent is the LOWEST-priority source: manual, agent, the
# emergency stop, and (with excess_charging.yield_to_schedule: true, the
# default) the solar-surplus adviser outrank it per battery, and a window
# opening under one simply WAITS.
#
# COMMISSIONED 2026-08-24 (operator request): the block below is live — the
# routes, runner, and snapshot projection compose, the console editor is
# enabled, and an EMPTY plan commands nothing until the operator publishes
# one.
#
# PARTITION GRANTED 2026-08-24 (DESIGN_NIGHT_CHARGE §3.2, the cutover's step
# 1 — the machinery staged, the night strategy still suspended): the windows
# below widened from the day-only YIELD default [["06:00","20:00"]] to cover
# 00:00-06:00 as well, in the SAME revision that adds the `night_charging:`
# block, because commissioning night charge and granting the night partition
# are one deliberate config revision — the validation refuses the one without
# the other. The site's derived posture is now `partition` (GET /api/v1/
# schedule and `schedule_state` report it; the night projection carries it
# too). The published-plan doctrine is unchanged: no night schedule is
# published and none should be (§4.3 — the night adviser IS the night
# mechanism; two writers of the same minutes is the invisible-starvation
# class).
schedule:
  # The allowed command windows, local civil time ("HH:MM" pairs; a pair
  # may cross midnight). The UNION of the pairs is what a schedule may
  # command. The night half of the union is the PARTITION grant, held for
  # the night strategy adviser — not for published schedules.
  allowed_windows_local: [["00:00", "20:00"]]
  intent_ttl_s: 10.0

# ---------------------------------------------------------------------------
# OFF-PEAK NIGHT CHARGE — THE NIGHT STRATEGY ADVISER
# (DESIGN_NIGHT_CHARGE + API_CONTRACTS "Off-peak night charge").
#
# The operator-confirmed replacement for the site's Docker solution (all
# three batteries at 2,500 W per unit, 00:00-06:00 nightly, dropping to a
# very low rate when house demand is high). A strategy layer in the
# excess-adviser pattern: per battery, inside the commissioned window and
# while enabled, reach the SOC charge ceiling by window end at <= rate_cap_w
# under the pinned pacing rule, submitting ordinary short-TTL `optimizer`
# CHARGE intents under the composed automation principal
# `energypod:night-adviser` (audit-attributable, never on REST/MCP).
#
# PRESENT-BUT-SUSPENDED is the shipped state (mirroring how the excess trial
# shipped): a PRESENT block composes the adviser, the `night_charge_state`
# snapshot projection, the `night_charge.state_changed` events, the guarded
# toggle route, and the PCS live-block promotion — `enabled: false` keeps
# participation OFF until the operator's cutover. An ABSENT block composes
# nothing at all and the toggle answers 409 night_charging_not_commissioned.
#
# THE DEMAND RULE reads the per-pod LOAD CT words (0x1000+20), NEVER the
# grid words: the grid word includes the adviser's OWN charging draw, so a
# demand rule on it would read a 3 x 2500 W charge as 7.5 kW of "demand" and
# hold forever. While MEASURED demand exceeds demand_threshold_w every
# eligible battery STANDS DOWN INTO ITS HOLD (the operator's directive,
# 2026-08-26: on a big night load the batteries stand down and the cheap
# off-peak grid serves the house, preserving stored solar for the expensive
# evening): each held battery STAYS IN the submission at hold_rate_w — an
# ordinary positive charge objective renewed every tick, whose live presence
# overrides the pod's own CT-following autonomy (which would otherwise
# DISCHARGE into the house). Never park, never a stop triple, never a
# zero-watt intent — the kernel never mints authority for zero watts, so a
# literal 0 W command would hand the pod straight back to autonomy. The hold
# releases when demand falls below threshold - hysteresis (normal capped
# charging resumes) OR at window end (withdrawn like any held intent).
# FAIL-CLOSED IS THE SAFETY DOCTRINE, not a posture: bad evidence (a
# missing/bad/stale load word) HOLDS at hold_rate_w — the EVIDENCE-FAILURE
# fallback alone, named `holding_on_demand` — because a stand-down answers
# MEASURED demand, never missing data, and must never silently free-run a
# fleet into autonomy drain during an EV night. Both arms land on the same
# positive rate; they are named apart by phase and reason code
# (`holding_on_demand`/`demand_evidence_*` vs
# `standing_by_on_demand`/`demand_above_threshold`), and the hold state is
# loud either way, never a silent never-charges.
#
# PRECEDENCE: manual/agent requests outrank it per battery (and their units
# are excluded from the submission until the claim lapses); it ALWAYS yields
# per unit to a published SCHEDULE claim (no opt-out flag); and it excludes
# units claimed by the excess adviser (FREE surplus outranks PAID import,
# the dawn corner — one direction only). Window end is NON-RENEWAL: the TTL
# lapse plus the ~3.5-4.0 s firmware watchdog return each pod to its own
# autonomy. No stop triples, no idle intents, ever.
#
# COMMISSIONING GATES (bind to block-PRESENCE; the runtime toggle can raise
# participation but never a cap, window, pacing choice, or grant):
# write_enabled mode with a policy; rate_cap_w <= policy.max_unit_charge_w;
# 0 < hold_rate_w < rate_cap_w; 0 < demand_exit_hysteresis_w <
# demand_threshold_w; demand_telemetry_max_age_s > control_period_s +
# essential_read_timeout_s; 0 < intent_ttl_s <= 300 and > control_period_s;
# assumed_capacity_wh present with exactly the fleet units IFF pacing is
# `even`; and the PARTITION grant above.
#
# THE CUTOVER (§3.4 — the remaining steps are the operator's, in order):
# arm the units (a human act; boot is disarmed and every restart re-arms
# nothing) -> stand Docker down -> enable at the toggle (the first enable
# carries "night_posture": "PARTITION_ACKNOWLEDGED" and captures the
# durable once-ever fact) -> one supervised night -> decommission Docker,
# verified by the night-writer detector's quiet window -> remove
# foreign_objective_expected_charge_w from the policy.
#
# PARITY NOTE (§3.4 step 1, stated honestly): max_fleet_charge_w 6000 below
# caps a simultaneous three-pod 2,500 W charge (7,500 W — what Docker ran
# nightly, so the wiring takes it); widen to 7500 for exact parity or keep
# 6000 as a deliberate ceiling — the kernel clamps per direction honestly
# either way and the tile shows the clamped rates.
night_charging:
  timezone: "Australia/Brisbane"   # REQUIRED — the off-peak window is a civil-time fact
  window_local: [["00:00", "06:00"]]   # the commissioned off-peak window
  enabled: true             # the DEFAULT (operator direction 2026-08-25: night
                            #   charging "remains the default setting even
                            #   after restarts") — the config IS the boot
                            #   default; the runtime toggle still overrides
                            #   within a session, and every restart returns
                            #   to this. Docker stood down 2026-08-25.
  rate_cap_w: 2500          # the per-battery cap (<= policy.max_unit_charge_w)
  demand_threshold_w: 1000  # the operator's own figure
  demand_exit_hysteresis_w: 200   # resume only below 800 W (no flapping)
  hold_rate_w: 100          # the stand-down/evidence-failure rate: a held
                            # battery stays IN the submission at this trickle
                            # charge (zero discharge, autonomy overridden) —
                            # bad demand evidence holds here too, never free-runs
  demand_scope: "per_phase" # fleet | per_phase — LIVE per the further operator
                            # directive 2026-08-26 ("Only the heavy one"): each
                            # battery judges ONLY its own LOAD CT
  # THE COMMISSIONED DEMAND RESPONSE is `park_standby` (the FURTHER operator
  # directive the same day): a MEASURED engage on ONE unit's own phase — its
  # LOAD word > demand_threshold_w — disarms and PARKS THAT UNIT ALONE into
  # vendor Standby via the ParkController lease (true standby: answers
  # neither charge nor discharge; the grid serves the heavy load), and it
  # resumes + re-arms when its word is GOOD below threshold - hysteresis.
  # Bad evidence keeps today's trickle-hold arm below unchanged, and bad
  # evidence DURING a standby KEEPS the park.  Validation refuses this value
  # without per_phase scope and a parking.max_lease_s covering the longest
  # window span + 120 s.  `hold` remains the default posture everywhere else.
  demand_response: "park_standby"

  pacing: "cap_first"       # Docker parity; `even` is deadline-paced (needs the map)
  demand_telemetry_max_age_s: 3.0
  intent_ttl_s: 10.0
  # --- NIGHT-V2 (DESIGN_NIGHT_CHARGE_V2): the forecast-aware top-up target --
  # THE SHIPPING POSTURE is forecast_suggest (section 9 step 2, config
  # revision two): the adviser COMPUTES and DISPLAYS tonight's per-battery
  # target, its forecast provenance, and the trust scoreboard, but charges
  # to the v1 ceiling — the submission math is byte-identical to full (a
  # named test), so this posture runs from day one at zero actuation risk
  # while the scoreboard accumulates one scored morning per day.
  # forecast_act is the operator's LATER revision (a human act, exactly like
  # every other authority grant): it needs the tariff keys with export FIT
  # strictly below the off-peak import (A3) plus the earned trust line, and
  # the console can never flip this key — there is deliberately no route.
  # `full` (the absent-key default) is exact v1 identity.
  target_policy: "forecast_suggest"
  forecast_quantile: 0.1    # the DRIVER slice (p10); p50 explains. The
                            # slot-wise netting compounds to ~95-99% full-by-
                            # midday service, not the nominal 90% (A7)
  midday_local: "12:00"     # the operator's wall-clock finish line (strictly
                            # after the window's end wall)
  floor_pct: 50.0           # the reserve floor (0, policy.max_soc_pct); it
                            # BINDS on most sunny days on this array — 40 is
                            # a defensible operator choice after a season
  charge_efficiency: 0.9    # the round-trip derate on credited surplus
  retarget_threshold_pct: 20.0   # with the 0.5 kWh absolute floor, per section 5.2
  retarget_min_gap_min: 60       # and the 2-per-window cap (from durable audit rows)
  # The capacity map (ASSUMPTION section 2.6 — the operator confirms; rhs's
  # 4200 is derived from cell-count proportionality, unmeasured): required
  # for any forecast posture AND for `even` pacing — one capacity truth for
  # pacing and the target alike.  Understatement UNDER-CHARGES (the wrong
  # way), so confirming rhs's true Wh matters most.
  assumed_capacity_wh: {lhs: 5000, mid: 5000, rhs: 4200}
  trust:
    required_days: 14       # one synoptic cycle; extend to 28 is documented
    tolerance_pct: 30.0     # mean |err| over the rolling scored window
    max_overforecast_bias_pct: 10.0   # the DANGEROUS direction, tighter (A4)
    max_underforecast_bias_pct: 20.0
    min_regime_days: 3      # low- AND high-surplus mornings (A4's terciles)

# ---------------------------------------------------------------------------
# POD PARKING (DESIGN_POD_PARKING) — the sanctioned standby mode.
# Commissioned 2026-08-24 on the live-proven rhs cycle
# (docs/evidence/standby-cycle-2026-08-24.md): Standby parks the PCS control
# path while comms/telemetry stay alive; the exit write returns the pod to
# Normal. This block is the ONE AND ONLY policy flag that can ever compose
# the 0x8000 {0,1} write — `debug_modes_enabled` stays its always-false
# tombstone, and values 2-6 remain permanently unreachable in code.
# Doctrine: the lease is the expiry ALARM, never the actor — expiry writes
# nothing and alarms; park/resume are interactive operator acts both
# directions; parking is NOT electrical isolation (the pack stays connected
# at full voltage).
parking:
  max_lease_s: 25200        # 7 h — covers the 6 h night window + margin (the
                            # night-standby wave's lease-cap gate; expiry stays
                            # ALARM-ONLY for operator parks too, Resume anytime)
  default_lease_s: 25200

# ---------------------------------------------------------------------------
# THE DAILY ENERGY SCORECARD (DESIGN_ENERGY_SCORECARD; advisory-only).
#
# A PRESENT block composes the daily energy account: the accountant tick in
# the fleet cycle (one bounded step after the polls, beside the excess
# adviser's projection update — it consumes observations and never blocks),
# the `energy_today` snapshot key, GET /api/v1/energy/days, the
# energy.day_rolled bus transition, the per-unit cumulative readthroughs,
# and the SQLite day ledger (schema version 2: energy_day + the durable
# live-day baseline, so counter deltas survive restarts by design — the
# device kept counting). An ABSENT block composes nothing: byte-identical
# snapshot, 409 energy_scorecard_not_commissioned on the route, no energy
# decode. There is deliberately NO `enabled` key — the scorecard is
# ADVISORY-ONLY (no safety interaction, no writes, no read-plan cadence
# change; the energy block already rides the cold ring and the PCS live
# block already rides the core), so no operator gate is needed to start
# accumulating evidence. Decommissioning is removing the block.
#
# THE A-1 GRID-PAIR PROTOCOL (why bought/sold come from OUR OWN integration
# of the per-pod CT grid word, not the vendor's grid counters): the 0x4101
# counter DECODE and the charge/discharge ROLE labels are capture-confirmed,
# but WHICH grid pair accumulates imports vs exports is evidence-open
# (field-mapping A-1). Until pinned, both pairs decode under NEUTRAL A/B
# names and are RECORDED every day into the record's counter_cross_check
# beside the integrated figures — the passive pinning evidence (a day
# discriminates at >= the coverage threshold, no counter reset, and both
# integrated sides >= 0.5 kWh; the verdict tolerance is max(0.5 kWh, 5%)).
# Pinning NEVER self-applies: `grid_counter_roles: vendor_labels|swapped`
# boots only when the durable energy-counter-roles-pinned audit fact exists
# (record the operator's P-A1 confirmation first), and only then may
# `grid_source: device_counter` be commissioned (the unpinned pair is
# refused as a display source — the strictly-more-complete source after
# pinning, the integration staying as the cross-check).
#
# Honesty rules the accountant owns: gaps above integration_max_gap_s are
# EXCLUDED from the integration and the coverage fraction (never
# interpolated); a day below min_day_coverage_pct renders PARTIAL with its
# percentage; a decreasing cumulative is a counter RESET (the day
# re-baselines, flags counter_reset:<metric>, and is audited
# energy_counter_reset_observed); site PV is never presented as measured
# (the pod inputs are unwired — the solar story is exported + captured
# surplus); the day rolls at site-timezone midnight with each record naming
# its zone and its own utc_offset_minutes.
#
# COMMISSIONED 2026-08-26 (the operator decision 1, DESIGN section 11):
# the block below is live with the pinned defaults — advisory-only, roles
# unpinned, the passive A-1 cross-check accumulating from day one.
energy_scorecard:
  # integrated = our own zero-order-hold integration of the per-pod CT grid
  #   word (0x1000+17, the control-grade PCS view ONLY) at the control rate.
  #   device_counter = the vendor grid pairs, REFUSED while the roles are
  #   unpinned (see the A-1 protocol above).
  grid_source: integrated
  # unpinned (neutral A/B naming + the passive cross-check) | vendor_labels
  #   | swapped (both pinned values additionally require the durable
  #   energy-counter-roles-pinned audit fact at boot).
  grid_counter_roles: unpinned
  # An inter-sample spacing above this is a GAP (zero energy, zero coverage,
  # never interpolated). Must exceed timing.control_period_s and stay
  # <= 60 s.
  integration_max_gap_s: 10.0
  # A day whose worst-unit coverage falls below this renders PARTIAL with
  # its percentage, never a quiet full number. (0, 100].
  min_day_coverage_pct: 95.0
  # OPTIONAL money. Absent (as commissioned) = kWh only, no figures; the
  # rates are the operator's own, labeled as theirs, and ride the wire as
  # the null `tariff` key until supplied:
  # tariff:
  #   currency: "AUD"            # ISO 4217
  #   import_cents_per_kwh: 28.0
  #   export_cents_per_kwh: 9.0

# PLANT HISTORY (the telemetry historian, DESIGN_PLANT_HISTORY) — the
# durable time-series record behind the console's planned History view.
# The block is deliberately COMMENTED OUT: history commissions as one
# explicit operator act (uncomment + restart), never silently.
#
# What it does when present: a TelemetryHistorian samples the observation
#   stream once per sample_interval_s into the EXISTING database (schema
#   migrates to version 3 in place on boot — nothing to run by hand), the
#   fleet loop records it beside the energy accountant, hourly rollups
#   keep the trend forever, and GET /api/v1/history serves windowed,
#   server-downsampled series (observe scope; the read-only
#   get_plant_history MCP tool rides along). Absent block: no samples, a
#   409 on the route, no snapshot key — nothing changes anywhere.
# Honesty rules it owns: gaps are absent rows, NEVER interpolated; absent
#   data is null, never zero; degraded periods carry their quality word
#   (missing > bad > stale > suspect); history is observability only — no
#   control path reads it and nothing restores from it at boot.
# Sizing at the defaults: ~200 B/row, 2,880 rows/battery/day, 14 days
#   full resolution (~24 MB) + ~10.5 MB/year of hourly rollups.
#
plant_history:
  # The sampling cadence: must exceed timing.control_period_s, <= 3600.
  # 30 s (default) = 2,880 rows/battery/day; 15 s doubles storage and
  # catches shorter transients; 60 s halves both.
  sample_interval_s: 30.0
  # The full-resolution retention window, 1..3650 days.
  retention_full_resolution_days: 14
  # Hourly rollup retention: 0 (default) = forever; a positive day
  # count bounds the rollup tier too.
  retention_rollup_days: 0

# ---------------------------------------------------------------------------
# FORECAST PROVIDERS (ARCHITECTURE section 17 — the reserved advisory layer).
#
# ADVISORY-ONLY, BY CONSTRUCTION: providers feed advisers and projections
# and NOTHING else — no kernel input, no read plan, no intent.  A missing,
# stale, or wrong forecast can only make an adviser's PROPOSAL worse, never
# actuate anything; a provider failure surfaces as its own data being
# unavailable (the consumer falls back) and never crashes observation.
# The architecture-fitness test pins it: no domain or application module
# may import adapters.providers.
#
# BLOCK PRESENCE + THE ENABLED POSTURE: a PRESENT block declares the stack
# and `enabled` gates composition; an ABSENT block is byte-identical to
# off.  COMMISSIONED 2026-08-24, the same day the LIVE contract was
# discovered with the operator's key: the Solcast HOBBYIST tier refuses
# the world_pv_power data endpoints outright (HTTP 403 "Hobbyist accounts
# are not allowed to access this endpoint") and serves the rooftop-sites
# flow instead — GET /rooftop_sites/{resource_id}/forecasts, Bearer auth,
# Accept: application/json, rows of pv_estimate/pv_estimate10/pv_estimate90
# in kW.  The registered site record ("Home": capacity 5 kW AC / 6.5 kW DC,
# azimuth 0 = equator-facing = NORTH for this southern-hemisphere array,
# tilt 30, loss factor 0.9, lat -27.59906 lon 153.068355) holds the
# geography and plane, so THIS file addresses the site by resource_id
# alone — no lat/long/capacity keys exist to drift from what Solcast
# models.  Nothing fetches at composition; the first consumer read takes
# the first leg.
#
# THE WIRE BUDGET: request_timeout_s bounds one leg; refresh_interval_s is
#   the MINIMUM spacing between legs (the rate-limit budget), and each wire
#   family may override it for ITS legs alone — the canonical split below:
#   the keyless Open-Meteo tier (10k/day) refreshes at the shared 900 s,
#   while Solcast's hobbyist key allows 10 requests per UTC day.
#   stale_after_s is when the staleness report raises the stale flag; it
#   must sit at or above every declared family's effective refresh (the
#   validator enforces it), so it rides the SLOWEST family — Solcast's
#   43200 s gate — while each member's age_s and last_error stay honest
#   per report regardless of the flag.  A failed refresh serves the cache
#   with its ORIGINAL fetched_at — rereading never freshens (the
#   architecture's caching honesty rule).
#
# THE FAMILIES (declare the ones this site wants; PV sources are mutually
#   exclusive — exactly one PV truth per site):
#   open_meteo: keyless weather (irradiance W/m2, cloud %, temperature C)
#     and, with `pv:`, a derived PV forecast.  Open-Meteo publishes NO
#     power variable; watts are derived from tilted-plane irradiance as
#     capacity_kw x GTI x derate.  azimuth uses the DOCS convention
#     (0 = south, -90 = east, +90 = west) — the OpenAPI YAML's "North=0"
#     wording is wrong.  Attribution (CC BY 4.0): "Weather data by
#     Open-Meteo.com" must accompany any surface that shows the data.
#     IF derived PV is ever wanted for this NORTH-facing array: the plane's
#     azimuth under Open-Meteo's convention is 180 (0 = south there) — the
#     exact mirror of the site's Solcast azimuth 0 (equator-facing = north).
#   solcast: the quantiled rooftop forecast (central/10%/90% slices).
#     THE KEY IS A REFERENCE, NEVER MATERIAL: api_key_env names the
#     environment variable resolved at boot (export SOLCAST_API_KEY=...);
#     the key rides the Authorization: Bearer header and never a query
#     string or this file.
#   load_baseline: no external API — tomorrow's load as the SAME SLOT LAST
#     WEEK read from the telemetry historian (requires the plant_history
#     block above; a missing unit or null word excludes a timestamp, never
#     zero-fills).  A baseline to graduate from, not a model.
#   tariff: no market feed yet (wholesale is a deferred ADR) — the
#     operator's own declared windows over a flat default, expanded in the
#     SITE timezone as contiguous intervals (DST-honest).  Every interval
#     is labeled market=static-config/quality=static so no consumer can
#     mistake it for a market signal.
forecast_providers:
  enabled: true    # commissioned 2026-08-24: the layer composes (advisory-only)
  request_timeout_s: 10.0
  # Open-Meteo weather context + the forecast-vs-recorded-surplus
  # cross-check scorer: keyless, 10k/day, so the shared 900 s cadence
  # (15 min between legs) is the budget — no override needed.
  refresh_interval_s: 900.0
  # The stale flag rides the SLOWEST declared refresh (Solcast's 43200 s
  # gate below): a cached forecast may legitimately be up to 12 h old, and
  # flagging the gate's own cadence stale would cry wolf.  age_s and
  # last_error stay honest per member at every age.
  stale_after_s: 43200.0
  # WEATHER ONLY — deliberately NO `pv:` sub-block: solcast is this site's
  # one PV truth (the two are mutually exclusive at validation).
  open_meteo:
    latitude: -27.59906
    longitude: 153.068355
    forecast_days: 2
  # THE HOBBYIST BUDGET MATH: the key allows 10 requests per UTC day.
  # refresh_interval_s 43200 (12 h) = 2 scheduled fetches/day, and each
  # process start also fetches once (the first consumer read primes an
  # empty cache) — 2 + ~1/restart leaves 7+ of the 10 for restarts and
  # re-commissioning inside every single-day window.
  solcast:
    api_key_env: SOLCAST_API_KEY   # the reference, never the key itself
    resource_id: b6bf-9d1d-0680-4078   # the registered "Home" rooftop site
    hours: 48
    period: PT30M
    refresh_interval_s: 43200.0
  # The historian-statistics load baseline, COMMISSIONED 2026-08-24 with
  # night-V2 (DESIGN_NIGHT_CHARGE_V2 section 9 step 1): the morning netting's
  # load half.  The 30 min slot grid matches Solcast's period; the 12 h
  # horizon covers [window_end, midday) from any window-open fetch;
  # weeks_back 1 is the same-slot-last-week read.  E_credit is deliberately
  # NET surplus with NO degrade-to-PV-only path (gross PV over-credits the
  # morning and under-charges -- the refused direction).
  load_baseline:
    slot_s: 1800.0
    horizon_s: 43200.0
    weeks_back: 1
  # TARIFF COMMISSIONED 2026-08-24 from the operator's bill (Night Saver EV
  # plan): general usage 30.77 c all times except 00:00-06:00; Night Saver
  # 7.27 c (exactly the commissioned night window); standard feed-in 2.0 c
  # at all times.  The A3 gate passes decisively: FIT 2.0 c is far below
  # the ~6.5 c break-even against 7.27 c off-peak storage (7.27/0.9 eta);
  # storing morning surplus forgoes ~2.2 c against ~8.1 c to buy -- the
  # legacy 44-52 c QLD FiT inversion does not apply to this site.
  tariff:
    currency: AUD
    default_import_cents_per_kwh: 30.77
    default_export_cents_per_kwh: 2.0
    horizon_s: 172800.0
    windows:
      - window_local: ["00:00", "06:00"]
        import_cents_per_kwh: 7.2727
        export_cents_per_kwh: 2.0

# ---------------------------------------------------------------------------
# PVOUTPUT.ORG REPORTING (the retiring Docker writer's replacement) —
# observability only, one POST per 5-minute slot.
#
# The site already reports to PVOutput through the old Docker container
# (byd/scheduler.py::_post_pv_metrics, every 5 minutes per battery).  This
# block replaces its WRITER role inside the controller; the cutover is the
# operator's standing order — enable this at the console toggle and disable
# the other container, in either order (the two writers posting the same
# slot is harmless: PVOutput add-status is add-or-update).
#
# BLOCK PRESENCE: a PRESENT block composes the surface — the uploader tick
# in the fleet cycle (bounded and fully suppressed, the historian's own
# envelope: a failure inside it is a gap on the dashboard, never a delay to
# control), the health snapshot at GET /api/v1/pvoutput/status, and the
# guarded runtime toggle POST /api/v1/pvoutput (arm scope, an interactive
# principal to enable, Idempotency-Key, typed confirmation PVOUTPUT).  An
# ABSENT block composes nothing and the status route answers 409
# pvoutput_not_commissioned.  `enabled: false` (below) keeps participation
# suspended at boot — the toggle starts it, and UNLIKE the night twin the
# choice is DURABLE (schema v7): a controller restart keeps whatever the
# operator last chose.
#
# THE FIELD LAYOUT is PINNED for dashboard continuity — the old container's
# exact mapping (byd/config.py), declared here so the dashboard's per-battery
# graphs keep their slots: lhs owns v7 (SoC %) + v8 (power W), rhs v9 + v10,
# mid v11 + v12.  v1-v6 are NEVER written (the solar inverter's integration
# owns those slots on this site).  SoC is the REAL BMS word (bms_soc_pct,
# 0x5000+9 — the old container posted a voltage-curve estimate; strictly
# better); power is the signed battery_watts posted UNNEGATED, because the
# battery power family (BMS 0x5008 / DCDC 0x2009 / system 0x0114, and the
# PCS 0x1007 grid P the operator remembers as "reg 4103") is live-proven
# NEGATIVE = CHARGE / POSITIVE = DISCHARGE (PROTOCOL_EVIDENCE 4b/4c) — the
# same convention pod-manager decodes, so the graphs stay continuous.
#
# NATIVE BATTERY FIELDS: b1/b2 fleet aggregates ride the SAME POST
# (b1 = sum of per-pod battery_watts, b2 = mean SoC over the identical pod
# capacities).  PVOutput's b1 uses the OPPOSITE sign (its add-status
# specification: positive = charge, "-200 (Discharge), 200 (Charge)"), so the
# adapter NEGATES the aggregate at the wire boundary — the one place either
# convention is translated.  b1 is mandatory when any battery field is sent,
# so b2 omits together with b1 whenever b1 cannot be computed fresh.
#
# HONESTY RULES: every field rides its own quality gate — a stale/bad SoC or
# power word is OMITTED from the POST, never zero-filled; a slot where no
# pod is fresh enough (max_sample_age_s, sized to cover the ~72-108 s cold
# ring that serves the system-block power word) is skipped entirely, a gap
# on the dashboard; no backfill, ever.  Auth-class refusals (bad/read-only
# key, or PVOutput's donation-mode 403 — v7-v12 and b1/b2 are donation-tier
# parameters) disable the uploader with a LOUD note on the status surface;
# the rate 403 backs off to PVOutput's own reset instant; a 400 surfaces
# PVOutput's reason text verbatim; transient failures retry at most
# retry_max times per slot, spaced — never bursts.
#
# SECRETS ARE REFERENCES: api_key_env / system_id_env name environment
# variables the controller launch sources from var/pvoutput.env (the
# var/solcast.env pattern, outside the repo per the no-secrets rule).  An
# unset reference composes the surface WITHOUT the wire client and the
# status carries the note — never a boot failure.
#
# COMMISSIONED 2026-08-25, PRESENT-BUT-DISABLED: the machinery and the
# console card compose now; the operator's toggle starts the posting when
# the other container stands down.
pvoutput:
  enabled: false
  api_key_env: PVOUTPUT_API_KEY
  system_id_env: PVOUTPUT_SYSTEM_ID
  interval_s: 300.0          # one POST per 5-minute slot (+30 s posting grace)
  max_sample_age_s: 120.0    # covers the cold ring that serves the power word
  request_timeout_s: 10.0
  retry_max: 1
  unit_slots: {lhs: [v7, v8], rhs: [v9, v10], mid: [v11, v12]}
  native_battery_fields: true

# ---------------------------------------------------------------------------
# BATTERY HEALTH WATCH (DESIGN_BATTERY_HEALTH_WATCH, CONTRACT v1.1) — the
# nightly readiness/probe/recovery program against the April-onward stuck
# mode (high reported SoC, no actuation, dead load CT on rhs).
#
# COMMISSIONING SEQUENCING (the contract's OWN section 16, unskippable):
# revisions one and two (census, then probe) are behind us.  This wave —
# the recovery CODE — lands CONFIG REVISION THREE, §16 step 4
# (RECOVERY-ADVISE): `stages: ["census", "probe", "recovery"]` with
# `recovery.mode: advise`, "the standing posture".  Advise writes NOTHING,
# ever: on a flagged night the program renders the ALERT-tier advisory
# naming the exact operator sequence (disarm -> park -> resume -> re-arm ->
# verify) through the standing surfaces, records what the operator did as
# the night's recovery evidence, and that is ALL it does — this step is
# where the operator calibrates their own trust in the census/probe
# conjunction.  `auto` stays two deliberate steps away: the per-unit
# supervised live verification (§16 step 5, whose evidence file becomes the
# `auto_receipts` receipt) and then config revision four with
# `mode: auto` + the receipts map (A6 — validation refuses the revision
# without it, which is what makes the sequence unskippable in one edit).
# Wave 0 (§3, the deadband and delivery-judged coherence) shipped as the
# same-cut prerequisite (A13).  The units must be ARMED at 23:00 for probes
# to run — the program never arms outside the ONE bounded verification
# re-arm inside an `auto` cycle (§7.4).
#
# BLOCK PRESENCE: a PRESENT block composes the HealthWatchController (one
# tick per fleet cycle inside the existing supervision pass — no new task
# class), the `health_watch_state` snapshot projection, the health.census /
# health.probe / health.program events, and GET /api/v1/health-watch/status.
# An ABSENT block composes NOTHING (byte-identical snapshot, 409
# health_watch_not_commissioned on the route).  There is NO runtime toggle
# for any stage: the authority ladder is climbed by config revision plus
# restart only.
#
# WHAT THIS WAVE WRITES: the census writes nothing, ever (historian rows
# and the standing observation stream only).  The probe is ONE bounded
# 300 W discharge intent per unit per night under `energypod:health-adviser`
# — ordinary dispatch traffic judged by every standing guard; a guard
# refusal is a SKIP, never a failure of the battery.  The recovery stage in
# the `advise` posture writes NOTHING either — its product is the advisory
# and the record.  In a later `auto` revision (never this one) the cycle's
# mode writes ride the ParkController's own {0, 1}-bound primitive under the
# same health principal, one cycle per unit per civil night, ending
# disarmed-and-Normal or alerting that it could not (I9).  One honest side
# effect (A8): on a quiet house the probe's 300 W briefly EXPORTS up to
# ~300 W for ~50 s — ~4 Wh, named so the export meter is never a surprise.
#
# THE WINDOW'S QUIET HOUR: [23:00, 23:45] must stay disjoint from the
# night_charging window and every schedule allowed window (validated), the
# whole program fits before the deadline, and the deadline plus the
# worst-case in-flight act still lands before the night window opens (A1's
# two arithmetic checks — refusals name their own arithmetic).  At runtime
# the program verifies the window is genuinely quiet (no live claims) else
# defers the night with reason `window_not_quiet`.
#
# ONCE PER CIVIL NIGHT, CRASH-HONEST: durable audit rows ARE the program's
# memory — a restart never re-runs a night whose rows show an attempt, and
# an interrupted census/probe raises the alert naming the state the unit
# was actually left in (A4).  `stuck.flag_persistence_nights` promotes a
# stuck flag from notice to alert (one noisy night is evidence, two is a
# pattern).
#
battery_health_watch:
  timezone: "Australia/Brisbane"   # must equal site.timezone (A9: one truth)
  window_local: "23:00"            # program start, the idle hour
  deadline_local: "23:45"          # no-new-ACT boundary (A1); legs finish
  stages: ["census", "probe", "recovery"]  # strict prefix; §16 revision three
                                   # (RECOVERY-ADVISE) — recovery staged in its
                                   # standing advise posture, which writes nothing
  stuck:
    evidence_window_h: 6           # historian lookback (>= 1; 6 = min_soc_hours)
    soc_floor_pct: 95.0
    soc_hold_frac: 0.9
    min_soc_hours: 6
    still_w: 50
    still_frac: 0.9
    grid_import_w: 500
    sibling_flow_w: 500
    flow_frac: 0.5
    load_floor_w: 30               # S4' own-phase floor (A16): the unit's OWN
                                   #   CT word above this while still = the flag
    sibling_load_w: 100            # the soft note's sibling-load context (A16)
    load_frac: 0.8
    phase_live_window_h: 168       # has this unit's CT word EVER moved? the
                                   #   dead-link vs idle-phase annotator (A16);
                                   #   >= evidence_window_h, within retention
    flag_persistence_nights: 2     # notice -> alert promotion
  probe:
    probe_w: 300                   # [100, 500], <= policy.max_unit_discharge_w
    settle_s: 20                   # [10, 60]; settle+sustain <= 90
    sustain_s: 30                  # [20, 60]
    pass_fraction: 0.5             # (0, 1]; the watchdog's own movement band
    pass_sample_frac: 0.8          # (0, 1]; a share, never the mean
    return_band_w: 150             # > stuck.still_w
    baseline_return_s: 30          # [10, 120]
    quiet_load_w: 1000             # fleet-mean grid-IMPORT gate (A8)
    load_move_w: 300               # mid-leg demand move -> inconclusive (A8)
    inter_unit_gap_s: 30           # >= 0
  recovery:
    # STAGED in its standing advise posture (§16 revision three): writes
    # nothing, ever — the advisory and the record are the whole stage until
    # the §16 steps 5-6 (the per-unit supervised live verification, then
    # `auto` + the receipts map).  `auto` additionally requires
    # auto_receipts naming EVERY fleet unit's supervised-verification
    # receipt or an explicit `excluded` (A6) — the config file itself
    # makes the §16 sequencing unskippable in one edit.
    mode: "advise"
    hold_s: 90                     # [60, 120]; the lease is hold_s + 60 s
    consecutive_fail_limit: 3      # counted: failed_write, write_unverified,
                                   #   failed_no_effect — NOT recovered_unproven
    probe_fail_nights: 2           # >= 2 (A16 route B): consecutive probe
                                   #   failures that make an unobservable-
                                   #   phase unit R-eligible without a flag

# The battery calibration cycling program (DESIGN_CALIBRATION_CYCLING.md,
# CONTRACT v1.1) — the periodic bottom-anchor traverse, ONE pod per
# cycle-night, selected by NEED.  This block lands in the §10 step-1 ADVISE
# posture: the trigger and eligibility run daily at 14:00, the rows land,
# the card renders, and NOTHING is submitted — `mode: act` is the operator's
# later revision (config revision + restart; there is no runtime toggle, and
# `act` carries no receipt gate by C15's conscious distinction: the act is
# ordinary OPTIMIZER dispatch, the night-charge precedent, no mode register
# — the 0x8000 values 2-6 stay permanently unwritten).  The sequencing:
#   step 1  advise (THIS revision) — days of honest trigger rows;
#   step 2  `mode: act` + the C6 one-shot naming mid for the supervised
#           measurement (the `request_measurement` key below, UNCOMMENTED in
#           that revision — a guarded, audited, once-consumed selection
#           request that waives `due` ONLY; every class gate still applies);
#   step 3+ graduation review, rhs probe-gated, then the quarterly rhythm.
# The historian-block prerequisite is met; the capacity map EQUALS
# night_charging's (one physical fact, §2.1's ruling extended); and
# min_discharge_w clears Victron's documented per-module ~50 W sensing
# threshold three times over (a commanded rate inside that band can meter
# as 0 W — rhs lives in it).
battery_calibration:
  timezone: "Australia/Brisbane"   # must equal site.timezone (A9)
  mode: "act"                      # §10 step 2 — the operator's "complete
                                   #   everything" commissioning, 2026-08-25
  window_local: "15:00"            # traverse open (C13: wide at the 0.8
                                   #   delivery floor — 7.5 h for ~7.0 h worst)
  traverse_end_local: "22:30"      # no-new-renewal; + ttl lands before the
                                   #   health watch (23:00) and night (00:00)
  plan_local: "14:00"              # the daily trigger/eligibility instant
  # C6's one-shot — §10 step 2: mid's supervised measurement (the operator's
  # request; waives `due` ONLY — every class gate still applies, consumed
  # once at the next plan, a restart cannot re-consume):
  request_measurement: {unit: mid, note: "2026-08-25 operator request"}
  trigger:
    trigger_floor_pct: 30.0        # X — "not below X% in N days"; >= floor_pct
    trigger_after_days: 60         # N — the quarterly-class cadence
    eligibility_window_days: 14    # the class-derivation lookback
    cycles_daily_floor_pct: 25.0   # lhs-class exclusion: below this on...
    cycles_daily_min_days: 5       #   ...>= this many dates => excluded
    min_daily_throughput_wh: 1000  # mid-class control-works evidence
    throughput_min_days: 3
    probe_pass_window_days: 7      # rhs-class: a passing probe this fresh
                                   #   unlocks the deferred class
  traverse:
    floor_pct: 10.0                # [5, 10] AND >= policy.minimum_soc_pct —
                                   #   at the commissioned policy exactly 10
                                   #   (the kernel-ordering rule, §4.3)
    discharge_w: 800               # [200, policy.max_unit_discharge_w]; the
                                   #   ~0.2 C warranty-protocol rate class
    min_discharge_w: 200           # > 3 modules x the ~50 W sensing floor
    intent_ttl_s: 10.0             # (0, 300]; > timing.control_period_s
    assumed_delivery_frac: 0.8     # (0, 1] — the fit check's delivery floor
    integration_max_gap_s: 10.0    # > timing.control_period_s, <= 60 (C9)
    energy_margin_wh: 100.0        # the lying-word bound's slack
    metering_allowance_wh: 100.0   # the integrator undercount allowance;
                                   #   margin + allowance <= the 5% band edge
                                   #   on the smallest pack (C8: 200 <= 210)
    assumed_capacity_wh: {lhs: 5000, mid: 5000, rhs: 4200}
                                   # MUST equal night_charging's map (§2.1)
  top_anchor:
    taper_deadline_local: "12:00"  # the operator's midday finish line
    taper_soc_pct: 99.0            # [50, 100)
    taper_limit_w: 0               # CCL collapse threshold, >= 0
    taper_sustain_s: 600           # [60, 3600] — the 10-minute rest class
    hold_min_s: 2700               # [1800, 3600] = 30-60 min
    hold_float_w: 100              # > 0, the Wave 0 deadband family
    poor_surplus_kwh: 3.0          # the solar/pod attribution split
  measurement:
    reanchor_delta_pct: 2.0        # (0, 20] — the quality-gated delta step
    floor_epsilon_pct: 2.0         # (0, 5] — the late-step tolerance (C4)

# The evening load-sharing program (DESIGN_EVENING_LOAD_SHARING.md, CONTRACT
# v1.1) — the netted-meter fleet discharge adviser.  This block lands in the
# §12 step-2 ADVISE posture: the full loop runs nightly inside 16:00-22:30 —
# it measures the netted work (the §3.3 conservation identity, both words
# directly measured), computes the SoC^2-weighted split, writes the
# opened/revised/close rows, renders the card — and submits NOTHING, ever.
# `mode: act` is the operator's later revision (config revision + restart;
# there is no runtime toggle) and it is ADDITIONALLY gated by the E6
# netting-evidence row: `act` without `act_netting_evidence` is a VALIDATION
# ERROR, and boot degrades an act block whose recorded evidence file is
# missing to advise LOUDLY.  The verification itself is the operator's
# bill-data act (§10/§15-5: the meter's interval data cross-checked against
# the summed per-pod grid words, the evidence file recorded under
# docs/evidence/) — it has NOT happened yet, so the key stays documented and
# ABSENT below.  The sequencing:
#   step 1  the phase map + the netting evidence (§10, BEFORE any act
#           evening; `record_phase_map` writes the map row);
#   step 2  advise (THIS revision) — enough evenings to see the honest edges
#           (a traverse evening's reduced split, a capability_limited peak,
#           a grid_evidence withdraw, and an evening where the split
#           materially re-weights an already-served load);
#   step 3  act + `act_netting_evidence` naming the recorded cross-check.
# The spill arithmetic (§3.4): matching, not biasing — a 1 kWh overshoot
# costs ~6 c, a 1 kWh undershoot ~23 c, the derate at the filed range's SAFE
# edge (1.16) removes the structural term, and the 150 W spill tolerance is
# a CEILING on accepted spill, never an allowance the plan aims for.  The
# window deliberately SHARES the calibration traverse's evening hours (§4's
# conscious distinction): both are same-direction discharge advisers, unit
# sets made disjoint at submission time by the claim exclusion (the `els-`
# prefix never a foreign claim to itself), the E5 claim-settle debounce
# covering the sibling's renewal seam, and the E2 `elsewhere_w` term
# subtracting every excluded unit's measured flow so the participants serve
# the RESIDUAL, never the evening ON TOP of the traverse.  The window's end
# + ttl lands before the health watch (23:00) and the night charge (00:00),
# both validated; the capacity map EQUALS night_charging's and the
# calibration traverse's (one physical fact, three keys); and there is
# deliberately NO `grid_telemetry_max_age_s` (E10) — the rollup reads the
# kernel's own `policy.max_telemetry_age_s`, one freshness truth.
evening_load_sharing:
  timezone: "Australia/Brisbane"   # must equal site.timezone (A9)
  mode: "act"                      # §12 step 3 — commissioned 2026-08-25 on
                                   #   the operator's direct attestation ("I
                                   #   do have net metering, no need to prove
                                   #   it, it just is"), recorded as
                                   #   docs/evidence/netting-attestation-2026-08-25.md
  act_netting_evidence: docs/evidence/netting-attestation-2026-08-25.md
                                   # `act` REQUIRES act_netting_evidence
                                   # (E6) — the key stays absent until the
                                   # operator's bill-data verification lands
  window_local: "18:00"            # the operator's evening (2026-08-25: the
                                   #   16:00 default widened down to their
                                   #   6pm-midnight ask as far as the walls
                                   #   allow — the 23:00 watch and 00:00
                                   #   night cap the end at 22:30)
  window_end_local: "22:30"        # no-new-renewal; + ttl lands before the
                                   #   health watch (23:00) and night (00:00)
  min_share_w: 500                 # [200, cap_w]; the partial-load floor
                                   #   (63-86% collapse below the rated band)
  cap_w: 2500                      # <= policy.max_unit_discharge_w
  participation_floor_pct: 20.0    # [policy.minimum_soc_pct, 50]; drop-out +
                                   #   redistribute (the old stack threshold)
  soc_exponent: 2.0                # [1.0, 4.0]; 3.0 restores the old
                                   #   stack's precedent exactly (§15-1)
  spill_tolerance_w: 150           # > 0; the bounded accepted spill ceiling
  import_tolerance_w: 100          # > 0; the deadband's import-side edge
  assumed_discharge_over_frac: 1.16  # [1.0, 1.5]; the command derate at the
                                   #   filed +15-16% overshoot's SAFE edge
  frozen_word_ticks: 8             # >= 2; E3 P1 — a word unchanged this many
                                   #   ticks while its unit's other word moved
  frozen_flow_delta_w: 200         # > 0; P1's movement floor
  delivery_move_floor_w: 400       # > 0; E3 P2 — the fleet battery move that
                                   #   demands an answer
  exchange_move_floor_w: 150       # > 0, < delivery_move_floor_w; P2's
                                   #   absence-of-response floor
  non_delivery_ticks: 3            # >= 1; E4 — consecutive ticks below 0.5 x
                                   #   share => not_delivering, share
                                   #   redistributes
  intent_ttl_s: 10.0               # (0, 300]; > timing.control_period_s; the
                                   #   E5 debounce is 2 x this (a stated
                                   #   constant, never a key)
  assumed_capacity_wh: {lhs: 5000, mid: 5000, rhs: 4200}
                                   # MUST equal night_charging's map and the
                                   #   calibration traverse's (one fact)
  # act_netting_evidence: "docs/evidence/netting-verification-2026-XX.md"
                                   # E6's gate — REQUIRED for mode: act; leave
                                   #   documented and ABSENT until the §10
                                   #   interval-data cross-check is recorded
