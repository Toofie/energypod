# The console's nginx: static web/dist + the same-origin proxy the Vite dev
# server provides in development (web/vite.config.ts): /api/v1 — WebSocket
# included — and /healthz forward to the controller service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The console is a single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # The guarded API — every /api/v1 route, with the event stream's WebSocket
    # upgrade (the console's live data plane rides /api/v1/events).
    #
    # Host is forwarded as $http_host — the ORIGINAL host:port, port included.
    # The controller's default WebSocket origin trust requires Origin's
    # netloc to EQUAL the received Host (rest.py: origin_parts.netloc ==
    # request_host); $host strips the port, so a browser on box:8082 failed
    # the check (`box:8082` != `box`) and the event stream reconnect-looped
    # while every REST call worked (observed on the Synology, 2026-09-04).
    location /api/v1/ {
        proxy_pass http://energypod:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://energypod:8080;
    }
}
