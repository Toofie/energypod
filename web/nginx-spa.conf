# EnergyPod operator console — static SPA host and API reverse proxy.
#
# Purpose
#   Serves the built React console (web/dist) as a single-page application and
#   reversely proxies the guarded API to the one controller process, so the
#   browser talks to a single origin (the WebSocket event stream therefore
#   satisfies the same-origin trust rule in docs/API_CONTRACTS.md, "API and
#   MCP", without needing a configured trusted-origin set).
#
# Usage
#   The controller container listens on controller:8080 (compose service name;
#   change the ``upstream`` block to host:port of a standalone deployment).
#   Mount web/dist at /usr/share/nginx/html:
#
#     nginx -c /path/to/nginx-spa.conf
#
#   The console calls only same-origin relative paths (/api/v1/...), so no
#   rewriting is required beyond the proxy passes below.
#
# Static validation performed here (Docker is not installed in the authoring
# environment; docs/CONTINUITY.md ledger step 12 defers the image build):
#   - nginx -t cannot run without nginx; the file was validated as POSIX-style
#     nginx syntax by construction (balanced braces, terminated directives) and
#     by a paren/quote scanner in the repository's static packaging check.
#   - The proxied paths were cross-checked against the routes served by
#     energypod.api.rest (/api/v1/*) and the unauthenticated /healthz.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # The single controller process (ADR-0002: one worker, never replicated
    # while control is enabled). No load balancing is ever configured here.
    upstream energypod_controller {
        server controller:8080;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        # --- guarded API: everything under /api/v1 goes to the controller --
        location /api/v1/ {
            proxy_pass http://energypod_controller;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            # Browser event stream (/api/v1/events) upgrades to WebSocket.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 10s;
        }

        # --- container liveness: same probe the Docker HEALTHCHECK uses ----
        location = /healthz {
            proxy_pass http://energypod_controller/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # --- built console (web/dist) as an SPA ---------------------------
        root /usr/share/nginx/html;
        index index.html;

        # Hashed build assets are immutable; index.html must never be cached
        # or an operator can be pinned to a stale console after an upgrade.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }

    # Map for the WebSocket Connection header (declared once at http level).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
